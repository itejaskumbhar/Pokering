<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokering — Preview</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section class="room">
    <header class="topbar">
      <div class="topbar-left">
        <span class="brand-mark small">♠</span>
        <span class="room-name">sprint7</span>
      </div>
      <div class="topbar-right">
        <span class="count-pill">6/6 voted</span>
        <button class="btn-ghost">New round</button>
        <button class="btn-ghost danger">Leave</button>
      </div>
    </header>

    <main class="stage">
      <div class="table-row">
        <div class="seat"><div class="seat-card revealed">3</div><div class="seat-name">Twan</div></div>
        <div class="seat"><div class="seat-card revealed">5</div><div class="seat-name">Arjun</div></div>
        <div class="seat"><div class="seat-card revealed">5</div><div class="seat-name">Ekta</div></div>
      </div>

      <div class="poker-table">
        <div class="table-msg">
          <div class="tally">
            <div class="tally-item"><span class="tally-card">3</span><span class="tally-count">1</span></div>
            <div class="tally-item"><span class="tally-card">5</span><span class="tally-count">3</span></div>
            <div class="tally-item"><span class="tally-card">8</span><span class="tally-count">2</span></div>
          </div>
          <span class="sub">6 cards revealed</span>
        </div>
      </div>

      <div class="table-row">
        <div class="seat"><div class="seat-card revealed">8</div><div class="seat-name">Mittal</div></div>
        <div class="seat is-you"><div class="seat-card revealed">5</div><div class="seat-name">Tejas</div></div>
        <div class="seat"><div class="seat-card revealed">5</div><div class="seat-name">Andreas</div></div>
      </div>
    </main>

    <footer class="deck">
      <button class="deck-card">0</button>
      <button class="deck-card">1</button>
      <button class="deck-card">2</button>
      <button class="deck-card">3</button>
      <button class="deck-card selected">5</button>
      <button class="deck-card">8</button>
      <button class="deck-card">13</button>
      <button class="deck-card">21</button>
      <button class="deck-card">34</button>
      <button class="deck-card">55</button>
      <button class="deck-card">89</button>
      <button class="deck-card">?</button>
      <button class="deck-card">☕</button>
    </footer>
  </section>
</body>
</html>
